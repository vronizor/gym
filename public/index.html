<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tally</title>
<meta name="theme-color" content="#0F1110">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tally">
<link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<script>
try {
  const t = localStorage.getItem("gym:theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#" aria-label="tally, all routines">
      <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
        <g stroke="currentColor" stroke-width="12" stroke-linecap="round">
          <line x1="34" y1="28" x2="34" y2="92"/>
          <line x1="60" y1="28" x2="60" y2="92"/>
          <line x1="86" y1="28" x2="86" y2="92"/>
        </g>
        <line class="slash" x1="18" y1="84" x2="102" y2="36" stroke-width="12" stroke-linecap="round"/>
      </svg>
      <span>tally</span>
    </a>
    <div class="actions">
      <button id="theme" class="pill" type="button" aria-label="Colour theme">Auto</button>
      <button id="wake" class="pill" type="button" hidden aria-pressed="false">Screen on</button>
    </div>
  </div>
</header>
<main id="main"><p class="loading">Loading routines…</p></main>
<footer class="foot"><span id="status"></span></footer>
<script src="app.js"></script>
</body>
</html>
